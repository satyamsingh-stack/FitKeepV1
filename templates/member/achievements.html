{% extends 'base.html' %}
{% block title %}Achievements{% endblock %}
{% block content %}
<div class="container-fluid">
    <h2><i class="bi bi-trophy"></i> Achievements</h2>
    <div class="row mt-4">
        {% for achievement in achievements %}
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body text-center">
                    <h1>{{ achievement.icon }}</h1>
                    <h5>{{ achievement.name }}</h5>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12"><p class="text-center text-muted">No achievements yet. Keep attending to earn badges!</p></div>
        {% endfor %}
    </div>
</div>
{% endblock %}
