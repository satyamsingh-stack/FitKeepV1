{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="container-fluid">
    <h2><i class="bi bi-person"></i> My Profile</h2>
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <p><strong>Name:</strong> {{ member.full_name }}</p>
                    <p><strong>Member ID:</strong> {{ member.member_id }}</p>
                    <p><strong>Phone:</strong> {{ member.phone }}</p>
                    <p><strong>Email:</strong> {{ member.email }}</p>
                    <p><strong>Status:</strong> <span class="badge bg-success">{{ member.status }}</span></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
