<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a2b">
  <title>You're offline · FitKeep</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#111a2b;color:#f5f7fb}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{max-width:440px;text-align:center}
    .mark{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 24px;border-radius:20px;background:#1b2940;color:#61e6a5;font-size:32px;font-weight:800}
    h1{margin:0 0 12px;font-size:clamp(28px,6vw,40px)}
    p{margin:0;color:#bac5d8;line-height:1.65}
    button{margin-top:24px;border:0;border-radius:10px;padding:12px 20px;background:#61e6a5;color:#111a2b;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">F</div>
    <h1>You're offline</h1>
    <p>FitKeep needs an internet connection to securely load your gym workspace. Reconnect and try again.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
